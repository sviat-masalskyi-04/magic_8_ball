<!DOCTYPE html>
<html>
<head>
    <title>Magic 8 ball</title>
    <style>
        #ball {
            width: 200px;
            height: 200px;
            background-color: rgb(0, 0, 0);
            color: rgb(255, 255, 255);
            border-radius: 50%;
            text-align: center;
            line-height: 1.6;
            justify-self: center;
            margin-top: 100px;
            align-items: center;
            padding: 100px;
            position: relative;
            z-index: 1;
        }
        body {
            background-color: rgb(255, 255, 255);
        }
        h1 {
            text-align: center;
            color: rgb(0, 0, 0);

        }
        #triangle {
            width: 200px;
            height: 200px;
            background-color: rgb(125, 0, 156);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            position: absolute;
            top: 100px;
            bottom: 100px;
            z-index: 0;
        }
    </style>
</head>
<body>
<h1>Think about your question...</h1>
<div id="ball">
    <h2>8</h2>
    <p>Thinking...</p>
    <button onclick="shakeTheBall()">Shake</button>
    <div id="triangle"></div>
</div>
</body>
</html>
